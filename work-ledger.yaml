goals:
- id: goal-rtd-plugin
  title: 把实时数据开发工艺做成插件
  status: active
  summary: 把实时数据开发工艺做成可安装的 Codex/Claude 插件：阶段状态机 + 硬门控 + 配置化执行器，包内零平台专有名，并给出可复现的验证证据。
  success_criteria:
  - 包内对脱敏词表零命中，且这项检查在 CI 里会拦
  - 阶段状态机：门控键只能由平台回读证据或当次确认原话产生，两者不可互替
  - hook 能拦住三类动作：直写证据或状态文件、无当次确认的 --yes、无当次确认的高风险动词
  - 工作流与设计稿 8.1-8.10 逐条对应
  - 执行器与限额全部来自项目级配置，缺项时报缺口并停
  - 验证记录区分已验证与未验证，不用推测内容填充

- id: goal-rtd-realtime-matrix
  title: 主流实时组件兼容矩阵：登记、本地起、逐个真跑
  status: active
  summary: 把“兼容主流实时处理组件”从一句话变成可复核的台账：组件注册表登记角色、构件与本地生命周期配方；本地实验台负责装、起、停、探、冒烟，并拦住“同时起两个重型组件”；逐个真跑、原始输出留档。没配方或跑不动的组件如实标“未验证”，不做含糊结论。
  success_criteria:
  - 注册表覆盖计算引擎、消息日志、湖表目录、流存储、服务层、变更捕获六类角色，并按 tier 1/2/3 标注验证程度
  - 实验台能装、起、停、探、冒烟，且拦住“同时起两个重型组件”
  - 冒烟判据是读回行数：读回 0 行与命令失败分开记，两者都不算通过
  - tier 1/2 组件都有执行器契约、都进能力矩阵，三份由静态校验绑死
  - 未验证的组件在台账里写“未验证”，不用推测内容填充

- id: goal-rtd-all-components-run
  title: 注册表里的组件逐个真跑通过
  status: active
  summary: 把“兼容主流实时组件”从登记与框架推进到逐个真跑：每个组件在本地起来、写进去、读回来，行数对得上才记通过；拿不到构件或起不来的，留下实测现场并如实写“未跑通”，不改判据。目标是让台账上每一行都有对应的原始输出。
  success_criteria:
  - 每个登记组件要么有“真跑通过”的读数与原始输出，要么有“未跑通”的实测原因（速度、来源、内存、权限）
  - 通过的组件 tier 升到 1，能力矩阵与注册表同步验证状态与已知缺口
  - 冒烟判据统一为“写进去多少行、读回来多少行”，读数由实验台按注册表比对，不看进程退出码
  - 新踩到的坑写进对应执行器契约，不留在会话里

- id: goal-rtd-open-source-ready
  title: 按 Apache 标准做开源就绪排查与优化
  status: active
  summary: 在公开之前，按 Apache 项目的通行标准把项目自查一遍，分三个维度：流程完整性（贡献、评审、发布、安全披露）、合理性（判据可机器验、事实只有一份、诚实标注）、友好性（上手、文档、示例、报错）。查出缺口就当场补上，补不了的写成需要所有者决策的条目，不留在会话里。
  success_criteria:
  - 许可与声明合规：许可证、声明文件、逐文件许可头齐备，且由静态校验把关
  - 流程完整：治理、行为准则、发布流程、贡献者条款、安全披露、issue 与 PR 模板齐备
  - 合理性可验：文档里的承诺要么有机器校验，要么标注未验证；事实源不重复
  - 友好性：陌生人能从文档地图找到入口，术语有表，求助渠道写清楚
  - 审计台账逐条记录现状、证据、处置，未完成项写明为什么需要决策

