name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 原来这里直接跑 pytest，而 runner 上根本没装 —— 4 个矩阵作业必红。
      # 依赖装在这里，别指望 runner 预装。
      - name: 安装测试依赖
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest~=8.0"
      # 脱敏词表本身不能进仓库（里面是真实内部代号）。配了 secret 就注入，没配就跳过该检查。
      - name: 注入脱敏词表（可选）
        shell: bash
        env:
          RTD_TERMS_JSON: ${{ toJSON(secrets.RTD_DESENSITIZE_TERMS) }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get("RTD_TERMS_JSON", "")
          terms = json.loads(raw) if raw and raw != "null" else ""
          if terms:
              pathlib.Path("tools/desensitize_terms.txt").write_text(terms.rstrip("\n") + "\n", encoding="utf-8")
              print("已从 secret 注入脱敏词表")
          else:
              print("未配置 secret RTD_DESENSITIZE_TERMS：第 7 项会显示 SKIP（本地需自备词表）")
          PY
      - name: 生成 Codex 入口技能（并校验生成物与提交一致）
        shell: bash
        run: python tools/build_codex_surface.py --check
      - name: 静态校验（八项，含脱敏扫描）
        shell: bash
        run: python tools/validate_plugin.py .
      - name: evals 结构校验
        shell: bash
        run: python tools/run_evals.py --check
      - name: hook 启动器适配检查
        shell: bash
        run: python tools/adapt_hooks.py --check
      - name: 单测
        shell: bash
        run: python -m pytest tests -q
